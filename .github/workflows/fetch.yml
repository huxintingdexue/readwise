name: Fetch Articles

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      initial_fetch:
        description: 'Set to 3 for first-time bootstrap (optional)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fetch script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          INITIAL_FETCH: ${{ github.event.inputs.initial_fetch || '' }}
        run: node scripts/fetch-articles.js

      # GitHub 会在仓库 60 天无提交后自动停用定时任务（2026-06 曾因此停更）。
      # 每天顺手重新启用一次，保持三个定时任务常开。
      - name: Keep scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in fetch.yml ingest-translate.yml publish-pending.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "enabled $wf" || echo "enable failed: $wf"
          done
